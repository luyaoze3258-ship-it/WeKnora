<text x="692" y="160" font-size="18" fill="#8492a8" text-anchor="middle" font-weight="500">私有落地</text>
<line x1="48" y1="190" x2="752" y2="190" stroke="#eef1f7" stroke-width="2"/>
<text x="48" y="246" font-size="34" font-weight="700" fill="#2f5fd0">03</text><text x="104" y="246" font-size="34" font-weight="700" fill="#232a38">主动整理</text><text x="48" y="284" font-size="20" fill="#5b6778">第三级：不等你问，主动把文档整理成互相链接的知识页</text>
<line class="draw d0" style="--len:260" stroke-dasharray="260" x1="400" y1="426" x2="150" y2="352" stroke="#b3c8f4" stroke-width="2.4"/>
