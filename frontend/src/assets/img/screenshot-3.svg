<g class=""><rect x="574" y="328" width="152" height="48" rx="10" fill="#fff" stroke="#d5dcea" stroke-width="2"/><text x="650.0" y="358.84" font-size="19" fill="#232a38" text-anchor="middle" font-weight="500">付款节点</text></g>
<g class=""><rect x="74" y="476" width="152" height="48" rx="10" fill="#fff" stroke="#d5dcea" stroke-width="2"/><text x="150.0" y="506.84" font-size="19" fill="#232a38" text-anchor="middle" font-weight="500">供应商 A</text></g>
<g class=""><rect x="574" y="476" width="152" height="48" rx="10" fill="#fff" stroke="#d5dcea" stroke-width="2"/><text x="650.0" y="506.84" font-size="19" fill="#232a38" text-anchor="middle" font-weight="500">验收标准</text></g>
<g class="pulse"><rect x="296" y="394" width="208" height="64" rx="14" fill="#2f5fd0"/><text x="400" y="420" font-size="15" fill="#c9d5ef" text-anchor="middle">知识页</text><text x="400" y="445" font-size="21" fill="#fff" text-anchor="middle" font-weight="700">采购管理</text></g>
<g class="pop d2"><rect x="270" y="512" width="260" height="34" rx="17" fill="#e5f6ee"/><text x="400" y="535" font-size="16" fill="#1d7f57" text-anchor="middle" font-weight="600">原文一改，相关知识页跟着改</text></g>
