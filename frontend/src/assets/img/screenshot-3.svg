<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
<style>
*{transform-box:fill-box}
.draw{animation:draw 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes draw{0%{stroke-dashoffset:var(--len)}30%,100%{stroke-dashoffset:0}}
.ring{transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.5}to{transform:scale(1.9);opacity:0}}
.pulse{transform-origin:center;animation:pulse 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes pulse{0%,100%{transform:none}12%{transform:scale(1.02)}24%{transform:none}}
.hl{animation:hl 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes hl{0%,100%{stroke:#e4e8f0}10%,30%{stroke:#2f5fd0}40%{stroke:#e4e8f0}}
.pop{transform-origin:center;animation:pop 4s cubic-bezier(.3,1.5,.5,1) infinite both}
@keyframes pop{0%,4%{transform:scale(.7);opacity:0}14%,100%{transform:none;opacity:1}}
.fill{transform-origin:left;animation:fill 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes fill{0%,8%{transform:scaleX(.05)}60%,100%{transform:none}}
.move{animation:move 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes move{0%,10%{transform:translateX(0);opacity:0}18%{opacity:1}48%{transform:translateX(var(--dx));opacity:1}55%,100%{transform:translateX(var(--dx));opacity:0}}
.sweep{animation:sweep 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes sweep{0%,20%{transform:translateX(-160px);opacity:0}30%{opacity:1}70%{transform:translateX(660px);opacity:0}100%{opacity:0;transform:translateX(660px)}}
.d1{animation-delay:.35s}.d2{animation-delay:.7s}.d3{animation-delay:1.05s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.move,.sweep,.ring{display:none}.draw{stroke-dashoffset:0!important}}
</style>
<rect x="2" y="2" width="796" height="596" rx="20" fill="#fff" stroke="#e4e8f0"/>
<text x="48" y="64" font-size="18" fill="#8492a8" font-weight="500">智员知识库 · 往上一级，少一层活</text>
<line x1="108" y1="112" x2="692" y2="112" stroke="#eef1f7" stroke-width="4" stroke-linecap="round"/>
<line x1="108" y1="112" x2="303" y2="112" stroke="#2f5fd0" stroke-width="4" stroke-linecap="round"/>
<line class="draw" style="--len:194" stroke-dasharray="194" x1="303" y1="112" x2="497" y2="112" stroke="#2f5fd0" stroke-width="4" stroke-linecap="round"/>
<circle cx="108" cy="112" r="18" fill="#2f5fd0"/><path d="M101 112l5 5 9-10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="108" y="160" font-size="18" fill="#8492a8" text-anchor="middle" font-weight="500">你问它答</text>
<circle cx="303" cy="112" r="18" fill="#2f5fd0"/><path d="M296 112l5 5 9-10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="303" y="160" font-size="18" fill="#8492a8" text-anchor="middle" font-weight="500">自己拆步骤</text>
<circle class="ring" cx="497" cy="112" r="18" fill="none" stroke="#2f5fd0" stroke-width="2"/><circle cx="497" cy="112" r="18" fill="#2f5fd0"/><text x="497" y="119" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="497" y="160" font-size="18" fill="#232a38" text-anchor="middle" font-weight="700">主动整理</text>
