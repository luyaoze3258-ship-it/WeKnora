<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
<style>
*{transform-box:fill-box}
.draw{animation:draw 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes draw{0%{stroke-dashoffset:var(--len)}30%,100%{stroke-dashoffset:0}}
.ring{transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.5}to{transform:scale(1.9);opacity:0}}
.pulse{transform-origin:center;animation:pulse 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes pulse{0%,100%{transform:none}12%{transform:scale(1.02)}24%{transform:none}}
.hl{animation:hl 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes hl{0%,100%{stroke:#e4e8f0}10%,30%{stroke:#2f5fd0}40%{stroke:#e4e8f0}}
.pop{transform-origin:center;animation:pop 4s cubic-bezier(.3,1.5,.5,1) infinite both}
@keyframes pop{0%,4%{transform:scale(.7);opacity:0}14%,100%{transform:none;opacity:1}}
.fill{transform-origin:left;animation:fill 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes fill{0%,8%{transform:scaleX(.05)}60%,100%{transform:none}}
.move{animation:move 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes move{0%,10%{transform:translateX(0);opacity:0}18%{opacity:1}48%{transform:translateX(var(--dx));opacity:1}55%,100%{transform:translateX(var(--dx));opacity:0}}
.sweep{animation:sweep 4s cubic-bezier(.22,.61,.36,1) infinite both}
@keyframes sweep{0%,20%{transform:translateX(-160px);opacity:0}30%{opacity:1}70%{transform:translateX(660px);opacity:0}100%{opacity:0;transform:translateX(660px)}}
.d1{animation-delay:.35s}.d2{animation-delay:.7s}.d3{animation-delay:1.05s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.move,.sweep,.ring{display:none}.draw{stroke-dashoffset:0!important}}
</style>
<rect x="2" y="2" width="796" height="596" rx="20" fill="#fff" stroke="#e4e8f0"/>
<text x="48" y="64" font-size="18" fill="#8492a8" font-weight="500">智员知识库 · 往上一级，少一层活</text>
<line x1="108" y1="112" x2="692" y2="112" stroke="#eef1f7" stroke-width="4" stroke-linecap="round"/>
<circle class="ring" cx="108" cy="112" r="18" fill="none" stroke="#2f5fd0" stroke-width="2"/><circle cx="108" cy="112" r="18" fill="#2f5fd0"/><text x="108" y="119" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="108" y="160" font-size="18" fill="#232a38" text-anchor="middle" font-weight="700">你问它答</text>
<circle cx="303" cy="112" r="17" fill="#fff" stroke="#d5dcea" stroke-width="2"/><text x="303" y="119" font-size="18" fill="#8492a8" text-anchor="middle" font-weight="600">2</text>
<text x="303" y="160" font-size="18" fill="#8492a8" text-anchor="middle" font-weight="500">自己拆步骤</text>
<circle cx="497" cy="112" r="17" fill="#fff" stroke="#d5dcea" stroke-width="2"/><text x="497" y="119" font-size="18" fill="#8492a8" text-anchor="middle" font-weight="600">3</text>
<text x="497" y="160" font-size="18" fill="#8492a8" text-anchor="middle" font-weight="500">主动整理</text>
<circle cx="692" cy="112" r="17" fill="#fff" stroke="#d5dcea" stroke-width="2"/><text x="692" y="119" font-size="18" fill="#8492a8" text-anchor="middle" font-weight="600">4</text>
<text x="692" y="160" font-size="18" fill="#8492a8" text-anchor="middle" font-weight="500">私有落地</text>
<line x1="48" y1="190" x2="752" y2="190" stroke="#eef1f7" stroke-width="2"/>
<text x="48" y="246" font-size="34" font-weight="700" fill="#2f5fd0">01</text><text x="104" y="246" font-size="34" font-weight="700" fill="#232a38">你问它答</text><text x="48" y="284" font-size="20" fill="#5b6778">第一级：多格式进库，检索字面 + 语义 + 图谱，回答带出处</text>
<text x="48" y="330" font-size="17" fill="#8492a8">文档怎么进来</text>
<g class=""><rect x="48" y="346" width="120" height="40" rx="10" fill="#f7f9fc" stroke="#e4e8f0" stroke-width="2"/><text x="108.0" y="372.12" font-size="17" fill="#232a38" text-anchor="middle" font-weight="500">PDF / Word</text></g>
<g class=""><rect x="178" y="346" width="120" height="40" rx="10" fill="#f7f9fc" stroke="#e4e8f0" stroke-width="2"/><text x="238.0" y="372.12" font-size="17" fill="#232a38" text-anchor="middle" font-weight="500">Excel / MD</text></g>
<g class=""><rect x="48" y="396" width="120" height="40" rx="10" fill="#f7f9fc" stroke="#e4e8f0" stroke-width="2"/><text x="108.0" y="422.12" font-size="17" fill="#232a38" text-anchor="middle" font-weight="500">图片 OCR</text></g>
<g class=""><rect x="178" y="396" width="120" height="40" rx="10" fill="#f7f9fc" stroke="#e4e8f0" stroke-width="2"/><text x="238.0" y="422.12" font-size="17" fill="#232a38" text-anchor="middle" font-weight="500">网页抓取</text></g>
<g class=""><rect x="48" y="448" width="250" height="40" rx="10" fill="#eaf0fd" stroke="none" stroke-width="2"/><text x="173.0" y="473.76" font-size="16" fill="#1e46a8" text-anchor="middle" font-weight="500">飞书 · 语雀 · Notion 自动同步</text></g>
<path d="M310 418h36" stroke="#d5dcea" stroke-width="2"/><path d="M340 412l8 6-8 6" fill="none" stroke="#2f5fd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<g class="move" style="--dx:30px"><circle cx="312" cy="418" r="5" fill="#2f5fd0"/></g>
<rect x="360" y="316" width="392" height="226" rx="14" fill="#f7f9fc" stroke="#e4e8f0" stroke-width="2"/><rect x="360" y="316" width="5" height="226" rx="2.5" fill="#2f5fd0"/><text x="384" y="352" font-size="18" fill="#8492a8">问：违约金比例是多少？</text><text x="384" y="392" font-size="21" fill="#232a38" font-weight="500">合同总额的 20%，并赔偿实际损失。</text><rect class="sweep" x="384" y="370" width="160" height="32" fill="#2f5fd0" fill-opacity=".08"/><g class="pop"><rect x="384" y="412" width="168" height="36" rx="10" fill="#fff" stroke="#b3c8f4" stroke-width="2"/><text x="468.0" y="435.76" font-size="16" fill="#1e46a8" text-anchor="middle" font-weight="500">[1] 采购合同 §7</text></g><g class="pop d1"><rect x="384" y="470" width="344" height="48" rx="10" fill="#e5f6ee"/><path d="M402 494l5 5 9-10" fill="none" stroke="#1d9e6c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="426" y="501" font-size="18" fill="#1d7f57" font-weight="600">库里没有的，直说回答不了</text></g>
</svg>
